server.address=127.0.0.1
server.port=0
spring.main.banner-mode=off
spring.datasource.url=jdbc:sqlite:${FORMA_DATA_DIR}/forma.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.synchronous=FULL
server.error.include-message=never
server.tomcat.max-http-form-post-size=64KB
logging.level.root=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{30} - %msg%n
