name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: forma-macos-arm64
          - name: Windows x64
            os: windows-2022
            artifact: forma-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Select Rust
        run: rustup default stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Formatting
        run: npm run format:check
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test backend and package desktop app
        run: npm run package:desktop
      - name: Upload backend failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-test-reports
          path: |
            backend/build.noindex/test-results/test/*.xml
            backend/build.noindex/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release.noindex/*.zip
            release.noindex/*_x64-setup.exe
            release.noindex/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
