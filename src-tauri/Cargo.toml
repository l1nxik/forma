[package]
name = "forma"
version = "0.2.0"
description = "A thoughtful, local-first personal planner"
authors = ["Forma contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSThread", "NSGeometry"] }
